# Documented public cases of suspicious prediction-market flow, replayed
# through the insider screen (app/insider_cases.py, tests/test_insider_cases.py,
# scripts/replay_insider_cases.py).
#
# Versioned on purpose, like data/claims.yaml: adding or changing a case is a
# reviewed diff with a source. Every case names where its numbers come from.
# Numbers a source did not give are modelled and say so in the note; a case
# whose shape cannot be rebuilt from its source is kept for the record with
# replayable: false.
#
# What this list is: a regression suite for the patterns the screen claims
# to catch. What it is not: a hit rate. Tracker posts and press reports are
# not established findings, and the list says nothing about the flow the
# screen flags besides these cases.
#
# Fields
#   id               stable slug
#   source           URL of the post, article, report or "trade store" for own data
#   source_kind      tracker_post | press | research | court | store
#   date             date of the flow (UTC), the replay clock is 18:00 UTC that day
#   category         group the case belongs to, for the report
#   market           question as the venue words it (drives the context classifier)
#   side, price      the outcome bought ("YES" or "NO", quoted: bare YES is a YAML boolean) and its price in (0, 1)
#   notional         dollars, all prints of the case together
#   wallets, prints  how many wallets and how many prints carried the notional
#   minutes_before_end   minutes from the last print to the market's end date
#   first_trade_days     days between the wallet's first trade on the venue and its
#                        first case print; null when nobody measured it
#   wallet           public address when the case names one (blockchain data)
#   outcome          won | lost | unknown, as far as the source says
#   expectation      flag | no_flag | excluded | open (see app/insider_cases.py)
#   replayable       false keeps a case for the record without a replay
#   note             what was modelled, and why the expectation is what it is

