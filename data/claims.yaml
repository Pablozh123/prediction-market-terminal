# Central claim and caveat register (Brief 03).
#
# This file is the single source for every disclaimer shown next to a score,
# for the claims the product is allowed to make (each with evidence and a
# verification date), and for phrases that must never appear in product copy.
# scripts/lint_claims.py enforces the forbidden list over the code base; the
# UI reads disclaimers exclusively through app/claims.py.
#
# Versioned in the repo on purpose (the one exception to the runtime-generated
# data/ directory): changing claim language must be a reviewed diff.
#
# How a surface gets its caveat:
#
#   data/claims.yaml  ->  app/claims.py            (Python readers, /api/claims)
#                     ->  scripts/publish_claims.py -> web/js/claims_register.js
#                                                   -> web/js/claims.js caveat()
#
# The generated module is what the browser reads, so a caveat renders before
# any request is made; /api/claims serves the same register to anything else
# and lets a deployed frontend pick up a newer one. Both copies are checked
# against this file by scripts/lint_claims.py.

version: 1
updated: 2026-08-28

# `surfaces` names the files that must render the entry, as a caveat('<key>')
# call. scripts/lint_claims.py fails when one of them does not, so an entry
# cannot quietly stop being shown. Entries without `surfaces` are read by
# Python callers (scoreline_view, report-card templates) rather than by a
# page of their own.
