forbidden_phrases:
  - phrase: "sagt zukuenftige Performance voraus"
    reason: "Vorhersage-Versprechen: Scores beschreiben den bisherigen Record, sie prognostizieren nichts."
  - phrase: "predicts future returns"
    reason: "Prediction promise: scores describe the past record only."
  - phrase: "predicts future performance"
    reason: "Prediction promise: scores describe the past record only."
  - phrase: "garantiert"
    reason: "Garantie-Sprache: nichts an oeffentlichen Marktdaten ist garantiert."
  - phrase: "sicherer Gewinn"
    reason: "Garantie-Sprache: es gibt keinen sicheren Gewinn in Prediction Markets."
  - phrase: "risk-free"
    reason: "Guarantee language: nothing here is risk-free."
    allow:
      - "risk-free rate"
  - phrase: "wir empfehlen zu kaufen"
    reason: "Beratungs-Sprache: das Produkt liefert Information, keine Kauf- oder Copy-Empfehlung."
  - phrase: "Kaufempfehlung"
    reason: "Beratungs-Sprache: das Produkt liefert Information, keine Kauf- oder Copy-Empfehlung."
  - phrase: "you should buy"
    reason: "Advice language: the product informs, it does not tell anyone to buy."
  - phrase: "you should copy"
    reason: "Advice language: the product informs, it does not tell anyone to copy a wallet."

# Wording that marks a standing caveat: a sentence about what a figure is
# NOT. Such a sentence belongs in `disclaimers` above and is rendered through
# caveat('<key>'); written by hand into a surface it is a disclaimer nobody
# reviews, and the register that is supposed to govern it does not know it
# exists. scripts/lint_claims.py reports every occurrence outside the
# generated register module.
#
# The list stays deliberately narrow. A marker that also matches ordinary
# prose ("no orders yet" on the copy desk) would train everyone to ignore the
# check. Where a marker legitimately appears inside method prose about one
# measurement, the exception is registered here with its reason instead of
# being silently excluded.
caveat_markers:
  - marker: "investment advice"
  - marker: "financial advice"
  - marker: "not a recommendation"
  - marker: "no order placement"
  - marker: "no orders placed"
  - marker: "nothing is placed"
  - marker: "nothing is sent to a venue"
  - marker: "not legal findings"
  - marker: "no return claim"
  - marker: "not a forecast"
  - marker: "does not predict"
  - marker: "not a promise"
  - marker: "provided as-is"
  - marker: "not proof"
    allow:
      # Mentions latency, method prose about one measured quantity: a price
      # move away from the pre-drop baseline is not evidence that the market
      # heard the statement. That is a property of that measurement, not a
      # standing caveat about the product, and it belongs in the paragraph
      # that defines first reaction.
      - "not proof the market heard anything"
