<script>
// Theme before first paint, so a stored light choice never flashes dark.
// Stored choice wins; first visit follows the system preference.
(function () {
  var t = 'dark';
  try { t = localStorage.getItem('mi-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch (e) { /* private mode */ }
  document.documentElement.dataset.theme = t;
  if (t === 'light') {
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = '#F4F1EA';
  }
}());
</script>
