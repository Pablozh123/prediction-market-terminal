name: Refresh wallet ledger

# The wallet cells on the landing read public/data/wallet_ledger.json. This
# rebuilds it read-only from the public Polymarket Data API and commits the
# result only when something beyond the timestamp changed. Cloudflare Pages
# and Railway both deploy from main, so the site follows on its own.
on:
  schedule:
    # Every six hours; the odd minute keeps the job off the top-of-hour
    # crowd on shared runners.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The fetcher needs only requests; the transformation itself is
      # stdlib (app/wallet_ledger.py, unit-tested).
      - name: Install dependencies
        run: pip install requests

      - name: Rebuild the ledger
        env:
          # Owner-declared total deposits; verifiable on-chain via the
          # wallet's USDC transfers. The public Data API cannot see them,
          # so the figure travels with the pipeline, not the payload.
          WALLET_DEPOSITS_USD: "300"
        run: python scripts/wallet_ledger.py

      # stand_utc moves on every run; a commit needs a real change, or the
      # history fills with rebuilds that say nothing.
      - name: Detect a real change
        id: diff
        run: |
          changed=$(python - <<'EOF'
          import json, subprocess
          new = json.load(open('public/data/wallet_ledger.json'))
          old = json.loads(subprocess.run(
              ['git', 'show', 'HEAD:public/data/wallet_ledger.json'],
              capture_output=True, text=True, check=True).stdout)
          old.pop('stand_utc', None)
          new.pop('stand_utc', None)
          print('yes' if old != new else 'no')
          EOF
          )
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/wallet_ledger.json
          git commit -m "Wallet ledger: scheduled rebuild from the public Data API"
          git push
