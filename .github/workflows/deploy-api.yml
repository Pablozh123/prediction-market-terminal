name: Deploy API

# api.marketintel.dev runs on Railway and does not follow GitHub on its own,
# while Cloudflare Pages redeploys the frontend on every push to main. This
# closes that gap: a push that touches the API image runs `railway up` and
# then waits for /healthz. It needs the repository secret RAILWAY_TOKEN (a
# Railway project token for the production environment) and skips itself,
# with a visible notice, while that secret is unset.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "app/**"
      - "src/**"
      - "scripts/run_alert_scanner.py"
      - "requirements.txt"
      - "Dockerfile"
      - "railway.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

# One deploy at a time, in order; a second push waits for the first.
concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'attractive-truth' }}
      HEALTH_URL: https://api.marketintel.dev/healthz
    steps:
      - name: Check for the token
        id: token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::RAILWAY_TOKEN is not set, so the API was not deployed. Run 'railway up --detach' by hand (docs/HANDOFF.md 9.1) or add the secret."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: "22"

      - name: Install the Railway CLI
        if: steps.token.outputs.present == 'true'
        run: npm install -g @railway/cli

      # Uploads the checkout (minus .gitignore, so data/ never ships) and
      # starts the build; --detach returns as soon as the upload is in.
      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: railway up --service "$RAILWAY_SERVICE" --detach

      # The previous container keeps answering until the new one is healthy,
      # so a single 200 proves nothing. Wait out the build, then require three
      # consecutive 200s.
      - name: Wait for the new container
        if: steps.token.outputs.present == 'true'
        run: |
          sleep 90
          ok=0
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || true)
            if [ "$code" = "200" ]; then ok=$((ok + 1)); else ok=0; fi
            if [ "$ok" -ge 3 ]; then
              echo "healthy: $HEALTH_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$HEALTH_URL did not answer 200 three times in a row after the deploy"
          exit 1
