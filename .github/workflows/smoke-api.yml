name: Smoke API

# Railway builds api.marketintel.dev from this repository's main branch on
# its own (the service's source is the GitHub repo), so nothing here deploys.
# What was missing is the check afterwards: a container that answers /healthz
# says nothing about the image being complete. This job waits until the API
# reports the commit that was just pushed (/api/health carries
# RAILWAY_GIT_COMMIT_SHA), then runs scripts/smoke_live_api.py against it.
# A failed smoke is a red run on the push that caused it, which is exactly
# the moment the owner is looking.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "app/**"
      - "src/**"
      - "data/claims.yaml"
      - "scripts/run_alert_scanner.py"
      - "scripts/smoke_live_api.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "railway.json"
      - ".github/workflows/smoke-api.yml"
  workflow_dispatch:

concurrency:
  group: smoke-api
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      API_BASE: https://api.marketintel.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Railway needs a minute or two to build and swap the container; the old
      # one keeps answering meanwhile. Poll /api/health until it names this
      # push's commit, then give the copy daemon a moment to settle.
      - name: Wait for Railway to serve this commit
        run: |
          want="${GITHUB_SHA}"
          for i in $(seq 1 40); do
            got=$(curl -s --max-time 15 "$API_BASE/api/health" | python3 -c 'import json,sys
            try:
                print(json.load(sys.stdin).get("commit") or "")
            except Exception:
                print("")' || true)
            if [ "$got" = "$want" ]; then
              echo "live: $got"
              sleep 20
              exit 0
            fi
            echo "live commit: ${got:-unknown} (waiting for $want)"
            sleep 15
          done
          echo "::error::$API_BASE never reported commit $want within 10 minutes; check the Railway build"
          exit 1

      - name: Smoke the live API
        run: python scripts/smoke_live_api.py "$API_BASE"
