name: CI

on:
  push:
    # Feature branches are tested as they are pushed, not first at the pull
    # request. Work here has previously sat on a branch for weeks; the point of
    # a check is to fail while the change is still small enough to read.
    branches: [main, "feat/**", "fix/**", "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README promises 3.12 or newer and the container image ships
        # 3.13, so both are tested rather than asserted.
        python-version: ["3.12", "3.13"]
    name: test (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Without Node the web render test skips itself silently, which would
      # leave roughly 4,000 lines of frontend unguarded.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # httpx2: starlette's TestClient needs it (tests/test_server_*.py);
          # a test dependency only, so it stays out of requirements.txt.
          pip install ruff httpx2

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Syntax check (py_compile)
        run: >-
          python -m py_compile
          prediction_terminal.py
          src/prediction_markets.py
          src/copy_trading.py
          app/backtester.py
          app/suspicion.py

      # Carries the Streamlit page smoke (tests/test_app_smoke.py): every
      # page of the monolith is rendered through AppTest against the
      # fixtures in tests/market_api_fixtures.py. It used to sit behind
      # RUN_APP_SMOKE, and in exactly that blind spot a KeyError took the
      # Search and Traders pages down for several pull requests while this
      # job stayed green. The check is hermetic now, so there is no reason
      # left to gate it; tests/test_app_smoke.py::SmokeGateTests fails if
      # anyone puts it back behind an env var.
      - name: Unit tests (includes the Streamlit page smoke)
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Claims lint
        run: python scripts/lint_claims.py
